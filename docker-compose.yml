version: '3.8'

services:

  back-end:
    build:
      context: ./back-end
    volumes:
      - ./back-end:/var/www/html
    env_file:
      - ./back-end/.env
    depends_on:
      - mysql
    networks:
      - app-network

  frontend:
    build:
      context: ./front-end
    ports:
      - "3000:3000"
    volumes:
      - ./front-end:/app
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: megada
      MYSQL_USER: password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./back-end:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - back-end
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
